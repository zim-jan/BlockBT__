site_name: Dokumentacja Techniczna BlockBT
site_description: System Backtestingu Strategii Algorytmicznych z UI React i FastAPI
theme:
  name: material
  language: pl
  features:
    - navigation.tabs
    - navigation.indexes
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend/app]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Architektura: architecture/overview.md
  - Backend:
      - Database: backend/database.md
      - Connectors: backend/connectors.md
      - Engines & Optimization: backend/engines_and_optimization.md
      - Optymalizacja wielu tickerów: backend/multi_ticker_optimization.md
      - Zarządzanie ryzykiem (SL/TP/Sizing): backend/risk_management.md
      - Analityka i tearsheety: backend/analytics_tearsheets.md
      - API & Agents: backend/api_and_agents.md
      - Rejestr introspekcji (Registry): backend/registry.md
  - Frontend:
      - Architecture: frontend/architecture.md
      - Visual Builder: frontend/visual_builder.md
      - Pisanie własnych wskaźników: frontend/custom_indicators.md
  - Decyzje architektoniczne (ADR):
      - ADR-0001 Broadcasting multi-symbol: adr/0001-broadcasting-multi-symbol.md
      - ADR-0002 Custom Factory + sandbox + Numba: adr/0002-custom-factory-sandbox-numba.md
      - ADR-0003 Advanced Portfolio + Risk: adr/0003-advanced-portfolio-risk.md
      - ADR-0004 QSAdapter Analytics + Tearsheets: adr/0004-qsadapter-analytics-tearsheets.md
      - ADR-0005 Dynamic Introspection Registry: adr/0005-dynamic-introspection-registry.md
      - ADR-0006 Walk-Forward Optimization: adr/0006-walk-forward-optimization.md
