site_name: Dokumentacja Techniczna BlockBT
site_description: System Backtestingu Strategii Algorytmicznych z UI React i FastAPI
theme:
  name: material
  language: pl
  features:
    - navigation.tabs
    - navigation.indexes
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend/app]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Architektura: architecture/overview.md
  - Backend:
      - Database: backend/database.md
      - Connectors: backend/connectors.md
      - Engines & Optimization: backend/engines_and_optimization.md
      - API & Agents: backend/api_and_agents.md
  - Frontend:
      - Architecture: frontend/architecture.md
      - Visual Builder: frontend/visual_builder.md
