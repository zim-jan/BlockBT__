site_name: Dokumentacja Techniczna BlockBT
site_description: System Backtestingu Strategii Algorytmicznych
theme:
  name: material
  language: pl
  features:
    - navigation.tabs
    - navigation.indexes
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Wstęp i Koncepcja:
      - Wstęp (Overview): index.md
      - Metodologia i Technologie (C1): c1_metodologia.md
      - Faza 1 (C2): c2_realizacja_faza1.md
      - Ekosystem i Integracje (C3): c3_realizacja_faza2_5.md
  - Architektura Systemu:
      - Warstwa Danych (Data Layer): data_layer.md
      - Warstwa Silnika (Engine Layer): engine_layer.md
      - Warstwa Optymalizacji (Optimization Layer): optimization_layer.md
  - Przewodnik Dewelopera (DEV):
      - Ogólnie: developer/overview.md
      - Wzorce Backtestingu: developer/backtesting_patterns.md
      - Zestawienie Klas: developer/class_reference.md
      - Dodawanie Zródeł Danych: developer/extending_data.md
      - Rozszerzanie Bazy Danych: developer/extending_db.md
      - Rozszerzanie GUI: developer/extending_gui.md
  - Referencja API (Kod):
      - Engine: api/engine.md
      - Database: api/db.md
      - Connectors: api/connectors.md
      - MCP: api/mcp.md
  - Bezpieczeństwo:
      - Audyt Bezpieczeństwa (DevSecOps): security_audit_report.md
