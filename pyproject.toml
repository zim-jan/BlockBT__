[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockbt"
version = "0.1.0"
description = "BlockBT — Self-hosted algorithmic backtesting environment (Dual-Engine, BYOL)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Data layer
    "pandas~=2.2",
    "pyarrow~=14.0",
    "yfinance~=0.2.40",
    # Database
    "sqlalchemy~=2.0",
    "alembic~=1.13",
    # Config & validation
    "pydantic~=2.5",
    "pydantic-settings~=2.2",
    "python-dotenv~=1.0",
    # Logging
    "loguru~=0.7",
    # Security
    "bcrypt~=4.1",
    "cryptography~=43.0.1",
    # vectorbt deps (vectorbt itself is vendored — do NOT add here)
    "numba~=0.56",
    "dill~=0.3",
    "plotly~=5.0",
    "imageio~=2.0",
    "tqdm~=4.0",
    "schedule~=1.0",
    "dateparser~=1.1",
    "scipy~=1.10",
    "scikit-learn~=1.2",
    # Phase 5: advanced trading
    "optuna~=3.0,<4.0",
    # Phase 6: REST API
    "fastapi~=0.100",
    "uvicorn[standard]~=0.23",
    # HTTP client (async OllamaClient)
    "httpx~=0.27",
    # Misc
    "pandas-stubs~=2.3.3",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.14"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",

]

[project.scripts]
blockbt = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:vectorbt.*",
    "ignore::FutureWarning:vectorbt.*",
    "ignore::UserWarning:vectorbt.*",
    "ignore::DeprecationWarning:numba.*",
]
