[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockbt"
version = "0.1.2"
description = "BlockBT — Self-hosted algorithmic backtesting environment (Dual-Engine, BYOL)"
readme = "README.md"
requires-python = ">=3.13,<3.15"

dependencies = [
    # Data layer
    "pandas>=2.0,<3.0",
    "pyarrow>=18.0",
    "yfinance>=0.2.22",
    # Database
    "sqlalchemy~=2.0",
    "alembic~=1.13",
    # Config & validation
    "pydantic~=2.5",
    "pydantic-settings~=2.2",
    "python-dotenv~=1.0",
    # Logging
    "loguru~=0.7",
    # Security
    "bcrypt",
    "cryptography",
    # vectorbt deps (vectorbt itself is vendored — do NOT add here)
    "numba>=0.60",
    "dill",
    "plotly>=4.12.0",
    "imageio",
    "tqdm",
    "schedule",
    "dateparser",
    "scipy>=1.10",
    "scikit-learn",
    "mypy-extensions", # Required by vendored vectorbt
    # Phase 5: advanced trading
    "optuna>=4.0",
    # Phase 6: REST API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # HTTP client (async OllamaClient)
    "httpx>=0.27",
    # Misc
    "psycopg",
    "pgvector",
    "ollama",
    "numpy>=1.23,<2.0",
    "psycopg-binary",
    "langchain-text-splitters",
    "mcp[cli]",
    # ruff/mkdocstrings przeniesione do [dev] — to narzędzia deweloperskie, nie zależności runtime (review 2026-07-15)
    "pandas-stubs~=2.3.3",
    "vectorbt[rust]>=1.0.0",
    "quantstats>=0.0.81",
    "ta-lib>=0.6.8",
]

[project.optional-dependencies]
alpaca = ["alpaca-py"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.24",

]

[project.scripts]
blockbt = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic", "migrations", "vectorbt_src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
exclude = ["vectorbt_src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short -m \"not perf\""
asyncio_mode = "auto"
markers = [
    "perf: testy wydajnościowe oparte na czasie zegara (flaky na CI; uruchamiane jawnie: -m perf)",
]
filterwarnings = [
    "ignore::DeprecationWarning:vectorbt.*",
    "ignore::FutureWarning:vectorbt.*",
    "ignore::UserWarning:vectorbt.*",
    "ignore::DeprecationWarning:numba.*",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.3",
]
