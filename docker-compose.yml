services:
  # ── Backend: FastAPI + uvicorn ──────────────────────────────────────────
  blockbt-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blockbt-api
    restart: unless-stopped
    ports:
      # Tylko loopback — granica zaufania aplikacji (ADR-0011).
      - "127.0.0.1:8000:8000"
    volumes:
      # Trwałe dane: baza SQLite, cache Parquet i logi. Ścieżka w kontenerze
      # musi zgadzać się z DATA_DIR z backend/app/core/config.py.
      - ./backend/data:/app/backend/data
    env_file:
      # SECRET_KEY nie ma wartości domyślnej — bez .env kontener nie wstanie.
      # Skopiuj .env.example do .env przed pierwszym uruchomieniem.
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - blockbt-internal

  # ── Frontend: React + Vite dev server ──────────────────────────────────
  blockbt-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: blockbt-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Wewnątrz sieci Dockera backend nie jest pod loopbackiem frontendu —
      # proxy Vite'a musi celować w nazwę serwisu (patrz frontend/vite.config.ts).
      - VITE_API_PROXY_TARGET=http://blockbt-api:8000
    depends_on:
      blockbt-api:
        condition: service_healthy
    networks:
      - blockbt-internal

networks:
  blockbt-internal:
    driver: bridge
