services:
  blockbt:
    build: .
    container_name: blockbt-ui
    ports:
      - "127.0.0.1:8501:8501" # Restrict to localhost as required
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
