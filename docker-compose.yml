services:
  # ── Backend: FastAPI + uvicorn ──────────────────────────────────────────
  blockbt-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blockbt-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Air-Gapped persistence: SQLite DB + Parquet data cache
      - ./local_data/db:/app/data/db
      - ./local_data/cache:/app/data/cache
    environment:
      - BLOCKBT_DB_PATH=/app/data/db/blockbt.db
      - BLOCKBT_CACHE_DIR=/app/data/cache
    command: >
      uvicorn blockbt.api.main:app
      --host 0.0.0.0
      --port 8000
    networks:
      - blockbt-internal

  # ── Frontend: React + Vite dev server ──────────────────────────────────
  blockbt-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: blockbt-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - blockbt-api
    command: npm run dev -- --host 0.0.0.0
    networks:
      - blockbt-internal

networks:
  blockbt-internal:
    driver: bridge
