# A generic, single database configuration.

[alembic]
script_location = backend/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .:backend
path_separator = os
# sqlalchemy.url celowo nieustawiony — env.py rozwiązuje URL bazy tak samo jak
# backend/app/db/session.py (BLOCKBT_DB_PATH → BLOCKBT_DB_URL/DATABASE_URL → fallback).

[post_write_hooks]
# Uncomment to auto-format migration scripts with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix MIGRATION_SCRIPT

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
